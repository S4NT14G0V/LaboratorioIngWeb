<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSchool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgSchool)" rx="12" />

  <!-- Grid lines -->
  <g stroke="#312e81" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- Dashboard Frame -->
  <rect x="50" y="40" width="500" height="280" rx="10" fill="#0f172a" stroke="#4338ca" stroke-width="1.5" />
  
  <!-- Dashboard Top Bar -->
  <rect x="50" y="40" width="500" height="36" rx="10" fill="#1e1b4b" />
  <circle cx="75" cy="58" r="5" fill="#f43f5e" />
  <circle cx="92" cy="58" r="5" fill="#fbbf24" />
  <circle cx="109" cy="58" r="5" fill="#10b981" />
  <text x="300" y="63" fill="#c7d2fe" font-family="monospace" font-size="11" text-anchor="middle">school-management-platform · React + Spring Boot + RBAC</text>

  <!-- Left Sidebar inside dashboard -->
  <rect x="50" y="76" width="100" height="244" fill="#111827" />
  <rect x="65" y="95" width="70" height="12" rx="3" fill="#4338ca" />
  <rect x="65" y="120" width="60" height="8" rx="2" fill="#374151" />
  <rect x="65" y="140" width="65" height="8" rx="2" fill="#374151" />
  <rect x="65" y="160" width="50" height="8" rx="2" fill="#374151" />
  <rect x="65" y="180" width="55" height="8" rx="2" fill="#374151" />
  <rect x="65" y="275" width="70" height="20" rx="4" fill="#a855f7" opacity="0.3" stroke="#a855f7" stroke-width="0.8" />
  <text x="100" y="289" fill="#e9d5ff" font-family="monospace" font-size="9" text-anchor="middle">RBAC: Admin</text>

  <!-- Right Dashboard Content -->
  <!-- Stats row -->
  <g transform="translate(170, 95)">
    <rect x="0" y="0" width="105" height="60" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
    <text x="12" y="22" fill="#a5b4fc" font-family="sans-serif" font-size="9">Estudiantes</text>
    <text x="12" y="45" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">1,248</text>

    <rect x="120" y="0" width="105" height="60" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
    <text x="132" y="22" fill="#a5b4fc" font-family="sans-serif" font-size="9">Cursos Activos</text>
    <text x="132" y="45" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">42</text>

    <rect x="240" y="0" width="115" height="60" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
    <text x="252" y="22" fill="#a5b4fc" font-family="sans-serif" font-size="9">Evaluaciones</text>
    <text x="252" y="45" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">98.4%</text>
  </g>

  <!-- Table data graphic -->
  <g transform="translate(170, 175)">
    <rect x="0" y="0" width="355" height="120" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <!-- Table Header -->
    <rect x="0" y="0" width="355" height="28" rx="6" fill="#1f2937" />
    <text x="15" y="18" fill="#9ca3af" font-family="monospace" font-size="10">Curso / Materia</text>
    <text x="145" y="18" fill="#9ca3af" font-family="monospace" font-size="10">Profesor</text>
    <text x="235" y="18" fill="#9ca3af" font-family="monospace" font-size="10">Estado</text>
    <text x="305" y="18" fill="#9ca3af" font-family="monospace" font-size="10">Acción</text>

    <!-- Row 1 -->
    <text x="15" y="48" fill="#f3f4f6" font-family="sans-serif" font-size="10">Ingeniería Web</text>
    <text x="145" y="48" fill="#9ca3af" font-family="sans-serif" font-size="10">J. Arango</text>
    <rect x="230" y="36" width="55" height="16" rx="8" fill="#10b981" opacity="0.2" />
    <text x="257" y="48" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Activo</text>
    <rect x="305" y="38" width="35" height="14" rx="3" fill="#6366f1" />
    <text x="322" y="48" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ver</text>

    <!-- Row 2 -->
    <text x="15" y="76" fill="#f3f4f6" font-family="sans-serif" font-size="10">Bases de Datos</text>
    <text x="145" y="76" fill="#9ca3af" font-family="sans-serif" font-size="10">UdeA</text>
    <rect x="230" y="64" width="55" height="16" rx="8" fill="#10b981" opacity="0.2" />
    <text x="257" y="76" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Activo</text>
    <rect x="305" y="66" width="35" height="14" rx="3" fill="#6366f1" />
    <text x="322" y="76" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ver</text>

    <!-- Row 3 -->
    <text x="15" y="104" fill="#f3f4f6" font-family="sans-serif" font-size="10">Arquitectura de Software</text>
    <text x="145" y="104" fill="#9ca3af" font-family="sans-serif" font-size="10">UdeA</text>
    <rect x="230" y="92" width="55" height="16" rx="8" fill="#fbbf24" opacity="0.2" />
    <text x="257" y="104" fill="#fbbf24" font-family="sans-serif" font-size="9" text-anchor="middle">Cierre</text>
    <rect x="305" y="94" width="35" height="14" rx="3" fill="#6366f1" />
    <text x="322" y="104" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ver</text>
  </g>
</svg>
