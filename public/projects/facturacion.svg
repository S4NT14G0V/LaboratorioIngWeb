<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg1)" rx="12" />
  
  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="360" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="520" y1="0" x2="520" y2="360" />
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="220" x2="600" y2="220" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Glow circle -->
  <circle cx="300" cy="180" r="140" fill="url(#glow1)" filter="blur(20px)" />

  <!-- Window Frame -->
  <rect x="70" y="50" width="460" height="260" rx="8" fill="#1e2230" stroke="#334155" stroke-width="1.5" />
  <!-- Window Header -->
  <rect x="70" y="50" width="460" height="34" rx="8" fill="#171b26" />
  <circle cx="95" cy="67" r="5" fill="#f43f5e" />
  <circle cx="112" cy="67" r="5" fill="#fbbf24" />
  <circle cx="129" cy="67" r="5" fill="#10b981" />
  <text x="300" y="72" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">dian-einvoice-service.ts · Spring Boot</text>

  <!-- Invoice Graphic -->
  <rect x="110" y="110" width="160" height="170" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <rect x="125" y="125" width="70" height="10" rx="2" fill="#38bdf8" />
  <rect x="125" y="145" width="130" height="6" rx="2" fill="#475569" />
  <rect x="125" y="160" width="110" height="6" rx="2" fill="#334155" />
  <rect x="125" y="175" width="120" height="6" rx="2" fill="#334155" />
  <line x1="125" y1="195" x2="255" y2="195" stroke="#334155" stroke-width="1" />
  <rect x="125" y="210" width="60" height="8" rx="2" fill="#475569" />
  <rect x="210" y="210" width="45" height="8" rx="2" fill="#10b981" />
  <rect x="125" y="235" width="80" height="16" rx="4" fill="url(#accent1)" opacity="0.8" />
  <text x="165" y="247" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">XML / CUFE</text>

  <!-- API Flow Diagram -->
  <g transform="translate(300, 115)">
    <rect x="0" y="0" width="200" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="15" y="24" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">POST</text>
    <text x="65" y="24" fill="#f8fafc" font-family="monospace" font-size="11">/api/v1/invoices</text>

    <!-- arrow down -->
    <path d="M 100 45 L 100 70 M 96 65 L 100 71 L 104 65" stroke="#818cf8" stroke-width="1.5" fill="none" />

    <rect x="0" y="75" width="200" height="40" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="15" y="99" fill="#818cf8" font-family="sans-serif" font-size="11">DIAN Web Service</text>
    <circle cx="175" cy="95" r="4" fill="#10b981" />

    <!-- arrow down -->
    <path d="M 100 120 L 100 135 M 96 130 L 100 136 L 104 130" stroke="#10b981" stroke-width="1.5" fill="none" />

    <rect x="20" y="140" width="160" height="24" rx="4" fill="#065f46" opacity="0.6" stroke="#10b981" stroke-width="0.8" />
    <text x="100" y="156" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">✓ Validado Exitoso 200</text>
  </g>
</svg>
