<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFitness" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgFitness)" rx="12" />

  <!-- Phone Mockup Center -->
  <g transform="translate(225, 30)">
    <rect x="0" y="0" width="150" height="300" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <!-- Speaker / Notch -->
    <rect x="50" y="10" width="50" height="5" rx="2" fill="#334155" />
    
    <!-- Screen content -->
    <rect x="10" y="25" width="130" height="255" rx="12" fill="#022c22" />
    
    <!-- Map Path on phone screen -->
    <path d="M 30 70 Q 70 80 80 120 T 110 180 T 50 220" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <circle cx="30" cy="70" r="5" fill="#38bdf8" />
    <circle cx="50" cy="220" r="6" fill="#f43f5e" />
    
    <!-- Mini Stats Cards -->
    <rect x="20" y="130" width="110" height="35" rx="6" fill="#064e3b" opacity="0.85" />
    <text x="30" y="146" fill="#94a3b8" font-family="sans-serif" font-size="8">DISTANCIA</text>
    <text x="30" y="160" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">6.42 km</text>
    
    <!-- GPS pill -->
    <rect x="20" y="40" width="60" height="16" rx="8" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="0.8" />
    <text x="32" y="52" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="bold">● LIVE GPS</text>
  </g>

  <!-- Left Stats & Tech Card -->
  <g transform="translate(45, 100)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="15" y="28" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Métricas en Vivo</text>
    <text x="15" y="50" fill="#94a3b8" font-family="sans-serif" font-size="9">Ritmo Promedio</text>
    <text x="15" y="70" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">4'52" /km</text>
    
    <text x="15" y="95" fill="#94a3b8" font-family="sans-serif" font-size="9">Calorías quemadas</text>
    <text x="15" y="115" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">485 kcal</text>
    
    <rect x="15" y="125" width="120" height="12" rx="3" fill="#1e293b" />
    <rect x="15" y="125" width="85" height="12" rx="3" fill="#10b981" />
  </g>

  <!-- Right Appium / Architecture Card -->
  <g transform="translate(405, 100)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="15" y="28" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">QA & Backend</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="monospace" font-size="10">• Python Django</text>
    <text x="15" y="72" fill="#e2e8f0" font-family="monospace" font-size="10">• React Native</text>
    <text x="15" y="92" fill="#e2e8f0" font-family="monospace" font-size="10">• Appium E2E</text>
    <text x="15" y="112" fill="#e2e8f0" font-family="monospace" font-size="10">• Scrum Team</text>
    <rect x="15" y="125" width="120" height="16" rx="4" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <text x="75" y="137" fill="#7dd3fc" font-family="monospace" font-size="9" text-anchor="middle">✓ E2E Tests Pass</text>
  </g>
</svg>
